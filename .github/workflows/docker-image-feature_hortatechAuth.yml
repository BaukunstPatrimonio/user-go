name: Build HortaTech user-go image

on:
  push:
    branches: [ "feature_hortatechAuth" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/feature_hortatechAuth'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check diff whitespace
        run: git diff --check

      - name: Set date tag
        run: echo "TAG=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push HortaTech branch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/baukunstpatrimonio/user-go:feature_hortatechAuth-latest
            ghcr.io/baukunstpatrimonio/user-go:feature_hortatechAuth-${{ env.TAG }}
