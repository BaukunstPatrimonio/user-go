syntax = "proto3";

option go_package = "github.com/BaukunstPatrimonio/user-go/server/user-pb";

package user_pb;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service User {
  rpc Create (UserRequest) returns (UserIDResponse) {}
  rpc Get (UserIDRequest) returns (UserResponse) {}
  rpc Update (UserUpdateRequest) returns (UserStatusResponse) {}
  rpc Delete (UserDeleteRequest) returns (UserStatusResponse) {}
  rpc List (google.protobuf.Empty) returns (ListUsersResponse) {}
  rpc Login (UserLoginRequest) returns (UserLoginResponse) {}
  rpc LoginWithPassword (UserLoginWithPasswordRequest) returns (UserTokenResponse) {}
  rpc RegisterWithPassword (UserRegisterWithPasswordRequest) returns (UserRegisterWithPasswordResponse) {}
  rpc RequestPasswordReset (UserRequestPasswordResetRequest) returns (UserRequestPasswordResetResponse) {}
  rpc ResetPassword (UserResetPasswordRequest) returns (UserResetPasswordResponse) {}
  rpc SetPhone (UserSetPhoneRequest) returns (UserResponse) {}
  rpc ChangePassword (UserChangePasswordRequest) returns (UserStatusResponse) {}
  rpc ChangeEmail (UserChangeEmailRequest) returns (UserChangeEmailResponse) {}
  rpc LogOut (UserMailRequest) returns (UserStatusResponse) {}
  rpc Validate (UserValidateRequest) returns (UserTokenResponse) {}
  rpc GetByEmail (UserMailRequest) returns (UserResponse) {}
  rpc TokenToUser (UserTokenRequest) returns (UserResponse) {}
  rpc Health (UserIDRequest) returns (UserStatusResponse) {}
  rpc UpdateUserAdminStatus (UpdateUserAdminRequest) returns (UserStatusResponse) {}
  rpc Refresh (UserTokenRequest) returns (UserTokenResponse) {}
}

message UserRequest {
  string email = 1;
  string name = 2;
  string profile_pic = 3;
  bool validated = 4;
  bool admin = 5;
  bool super_admin = 6;
  string code = 7;
  google.protobuf.Timestamp code_expire = 8;
}

message UserLoginRequest {
  string email = 1;
  string browser = 2;
  string browser_version = 3;
  string operating_system = 4;
  string operating_system_version = 5;
  string cpu = 6;
  string language = 7;
  string timezone = 8;
  bool cookies_enabled = 9;
}

message UserMailRequest {
  string email = 1;
}

message UserTokenRequest {
  string token = 1;
  string browser = 2;
  string browser_version = 3;
  string operating_system = 4;
  string operating_system_version = 5;
  string cpu = 6;
  string language = 7;
  string timezone = 8;
  bool cookies_enabled = 9;
}

message UserIDRequest {
  uint32 id = 1;
}

message UserDeleteRequest {
  string email = 1;
  bool permanently = 2;
}

message UserUpdateRequest {
  string email = 1;
  string name = 2;
  string profile_pic = 3;
  string bucket = 4;
}

message UserIDResponse {
  uint32 id = 1;
  uint32 status = 2;
}

message UserStatusResponse {
  uint32 status = 1;
}

message ListUsersResponse {
  repeated UserResponse users = 1;
}

message UserResponse {
  string email = 1;
  string name = 2;
  string profile_pic = 3;
  bool validated = 4;
  bool admin = 5;
  bool super_admin = 6;
  string code = 7;
  google.protobuf.Timestamp code_expire = 8;
  string bucket = 9;
  uint64 id = 10;
  string phone_e164 = 11;
}

message UserValidateRequest {
  string code = 1;
}

message UserLoginResponse {
  string code = 1;
  uint32 status = 2;
}

message UserTokenResponse {
  string email = 1;
  string token = 2;
  uint32 status = 3;
  string token_refresh = 4;
  google.protobuf.Timestamp token_refresh_expires = 5;
  google.protobuf.Timestamp token_expires = 6;
}

message UpdateUserAdminRequest {
  string email = 1;
  bool admin = 2;
}

message UserLoginWithPasswordRequest {
  string email = 1;
  string password = 2;
  string browser = 3;
  string browser_version = 4;
  string operating_system = 5;
  string operating_system_version = 6;
  string cpu = 7;
  string language = 8;
  string timezone = 9;
  bool cookies_enabled = 10;
  string phone_e164 = 11;
}

message UserRegisterWithPasswordRequest {
  string email = 1;
  string name = 2;
  string password = 3;
  string browser = 4;
  string browser_version = 5;
  string operating_system = 6;
  string operating_system_version = 7;
  string cpu = 8;
  string language = 9;
  string timezone = 10;
  bool cookies_enabled = 11;
  string phone_e164 = 12;
}

// verification_code crosses a trusted internal gRPC boundary so a consuming
// backend can deliver it. Public browser-facing APIs must not echo it.
message UserRegisterWithPasswordResponse {
  uint64 user_id = 1;
  string verification_code = 2;
  google.protobuf.Timestamp code_expires = 3;
  uint32 status = 4;
}

message UserRequestPasswordResetRequest {
  string email = 1;
}

// reset_token crosses a trusted internal gRPC boundary for email delivery.
// Public browser-facing APIs must always return a generic accepted response.
message UserRequestPasswordResetResponse {
  string reset_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  uint32 status = 3;
}

message UserResetPasswordRequest {
  string reset_token = 1;
  string new_password = 2;
}

message UserResetPasswordResponse {
  uint32 status = 1;
}

message UserSetPhoneRequest {
  UserTokenRequest auth = 1;
  string phone_e164 = 2;
}

message UserChangePasswordRequest {
  UserTokenRequest auth = 1;
  string current_password = 2;
  string new_password = 3;
}

// verification_code crosses only the trusted internal gRPC boundary for the
// existing verification email publisher; browser-facing APIs must not echo it.
message UserChangeEmailRequest {
  UserTokenRequest auth = 1;
  string email = 2;
}

message UserChangeEmailResponse {
  string verification_code = 1;
  google.protobuf.Timestamp code_expires = 2;
  uint32 status = 3;
}
